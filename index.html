<!doctype html>
<html class="no-js" lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yams - Calculateur de score</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Calculateur de score pour le jeu de dés Yams">

  <meta property="og:title" content="Yams - Calculateur de score">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>

  <main id="welcome" class="welcome">
    <h1 class="welcome-title">Yams Calculator</h1>
    <p class="welcome-subtitle">Le calculateur de score pour vos parties de Yams</p>
    <button type="button" id="welcomeStartButton" class="welcome-start">Commencer une nouvelle partie</button>
  </main>

  <div id="app" class="app" hidden>
    <h1>Yams — Calculateur de score</h1>

    <div class="controls">
      <button type="button" id="newGameButton">Nouvelle partie</button>
      <span id="turnLabel" class="turn-label" aria-live="polite"></span>
      <button type="button" id="nextTurnButton" class="primary">Valider le tour</button>
    </div>

    <div class="table-wrapper">
      <table id="scoreTable" aria-label="Feuille de score Yams"></table>
    </div>
  </div>

  <dialog id="setupDialog" class="setup-dialog" aria-labelledby="setupTitle">
    <form id="setupForm" method="dialog">
      <h2 id="setupTitle">Nouvelle partie</h2>

      <div class="setup-field">
        <label for="playerCount">Nombre de joueurs</label>
        <select id="playerCount">
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
        </select>
      </div>

      <fieldset id="playerNames" class="setup-names">
        <legend>Noms des joueurs</legend>
      </fieldset>

      <div class="setup-actions">
        <button type="button" id="setupCancel">Annuler</button>
        <button type="submit" class="primary">Commencer</button>
      </div>
    </form>
  </dialog>

  <dialog id="endDialog" class="end-dialog" aria-labelledby="endTitle">
    <div class="end-trophy" aria-hidden="true">🏆</div>
    <h2 id="endTitle">Partie terminée !</h2>
    <p id="endWinner" class="end-winner"></p>
    <ol id="endRanking" class="end-ranking" aria-label="Classement"></ol>
    <div class="end-actions">
      <button type="button" id="endClose">Voir la feuille</button>
      <button type="button" id="endRestart" class="primary">Recommencer une partie</button>
    </div>
  </dialog>

  <script src="js/app.js"></script>

</body>

</html>
